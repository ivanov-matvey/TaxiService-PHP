services:
  web:
    build: .
    container_name: taxi-container
    volumes:
      - ./:/var/www/html/
    ports:
      - 8080:80
  db:
    image: mysql:latest
    container_name: taxi-db-container
    volumes:
      - db:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=taxi
      - MYSQL_ROOT_PASSWORD=root
  phpmyadmin:
    image: phpmyadmin
    container_name: taxi-phpmyadmin-container
    restart: always
    ports:
      - 8081:80
    environment:
      - PMA_HOST=db
    depends_on:
      - db
volumes:
  db: